<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
html,body{margin:0;background:transparent}
#lk{position:relative;width:7452px;height:1130px;overflow:hidden}
#lk img{position:absolute;display:block}
#url{position:absolute;white-space:nowrap;font-family:'Newsreader',serif;font-weight:400;line-height:1}
</style></head><body>
<div id="lk"><img id="seal"><img id="text"><div id="url">www.arenaschool.org</div></div>
<script>
const q=new URLSearchParams(location.search);
const c=q.get('c')||'navy', ink=q.get('ink')||'#152636', bg=q.get('bg')||'transparent';
const shift=+(q.get('shift')||115), F=+(q.get('f')||250), tr=q.get('tr')||'0.14em', uTop=+(q.get('top')||900);
document.getElementById('lk').style.background=bg;
const s=document.getElementById('seal'); s.src='seal-'+c+'.png'; s.style.left='0px'; s.style.top='0px';
const t=document.getElementById('text'); t.src='text-'+c+'.png'; t.style.left='1300px'; t.style.top=(-shift)+'px';
const u=document.getElementById('url'); u.style.color=ink; u.style.fontSize=F+'px'; u.style.letterSpacing=tr; u.style.left='1377px'; u.style.fontWeight=(q.get('w')||'400'); u.style.top=uTop+'px';
</script></body></html>
