<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arena School — OG</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,300;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F4EFE3;
    font-family: 'Geist', system-ui, sans-serif;
    color: #1A1A1D;
    display: grid;
    grid-template-columns: 1fr 460px;
    align-items: center;
    padding: 0;
  }
  .left { padding: 80px; display: flex; flex-direction: column; height: 100%; justify-content: center; gap: 28px; }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #8F3A28;
  }
  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 70px;
    line-height: 1.04;
    letter-spacing: -0.022em;
    color: #1A1A1D;
    max-width: 620px;
  }
  h1 em { font-style: italic; font-weight: 400; color: #8F3A28; }
  .sub {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 24px;
    line-height: 1.35;
    color: #52525B;
    max-width: 580px;
  }
  .footrow {
    display: flex; align-items: baseline; gap: 16px;
    margin-top: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 13px; letter-spacing: 0.1em;
    color: #88857B;
  }
  .footrow .url {
    color: #8F3A28; font-weight: 600; letter-spacing: 0.04em;
    text-transform: lowercase;
  }
  .right {
    background: #0F0E0C;
    width: 460px; height: 630px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .right img { width: 360px; height: 360px; object-fit: contain; }
  /* invert white background of crest to read on dark */
  .right { background: #F4EFE3; }
  .right::after {
    content: "";
    position: absolute; inset: 0;
    border-left: 1px solid #D6CFBC;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow">Arena School · Est. MMXXVI</div>
    <h1>Every kid is about to have a tutor <em>smarter</em> than their teacher.</h1>
    <div class="sub">The world's first AI-native school. Open-source from day one. Cohort Zero, Fall 2026.</div>
    <div class="footrow">
      <span class="url">arenaschool.org</span>
      <span>·</span>
      <span>SF · Shenzhen · Bali</span>
    </div>
  </div>
  <div class="right">
    <img src="photos/crest.png" alt="Arena School crest">
  </div>
</body>
</html>
