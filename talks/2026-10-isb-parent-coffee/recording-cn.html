<style>
:root{--ink:#152636;--ink2:#4A5768;--btn:#152636;--btn-h:#22385a;--paper:#F3E9DD;--paper-h:#FBF4EA;--card:#FBF4EA;--line:rgba(21,38,54,.12);
  --text:#152636;--soft:#4A5768;--muted:#6B7584;--serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--gx:max(20px,env(safe-area-inset-left))}
html[lang="zh-CN"]{--serif:'Arena Serif SC','Newsreader','Songti SC','Noto Serif SC','Source Han Serif SC','STSong',serif;
  --sans:'Arena Sans SC Punct','Geist','PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:400 17px/1.6 var(--sans);color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;text-wrap:pretty}
html[lang="zh-CN"] body{line-break:strict;font-size:16.5px;line-height:1.75}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink2);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--gx)}
.hd{background:var(--paper-h);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 0 30px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.bar a.home{display:inline-flex;align-items:center;min-height:48px}
.wm{display:block;height:auto;width:158px}
.sw{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:48px;padding:0 16px;border:1px solid rgba(21,38,54,.25);border-radius:999px;
  font:500 15px/1 var(--sans);color:var(--soft);text-decoration:none;background:rgba(252,243,237,.7)}
.sw:hover{border-color:var(--ink2);color:var(--ink)}
.intro{margin-top:22px;max-width:760px}
.ev{margin:0 0 10px;font:500 12px/1.45 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
html[lang="zh-CN"] .ev{letter-spacing:.04em;font-size:13px}
.k{margin:0 0 6px;font:600 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
html[lang="zh-CN"] .k{letter-spacing:.04em;font-size:13px}
h1{margin:0;font:500 31px/1.1 var(--serif);letter-spacing:-.022em;color:var(--ink);text-wrap:balance}
h1 em{font-style:italic;color:var(--ink2)}
html[lang="zh-CN"] h1{font-size:27px;line-height:1.38;letter-spacing:0}
.by{margin:14px 0 0;font-size:15.5px;line-height:1.5;color:var(--soft)} .by b{font-weight:500;color:var(--text)}
.lede{margin:10px 0 0;font-size:16.5px;line-height:1.55;color:var(--soft)}
main.wrap{padding-top:28px;padding-bottom:8px}
.rec{display:grid;gap:22px;align-items:start}
/* the 16:9 slot: cover slide + a quiet label; the real <video> replaces it once a URL is set and the gate is open */
.rv{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#152636;border:1px solid var(--line)}
.rv img,.rv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rv video{object-fit:contain;background:#000;z-index:3}
.rv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,38,54,0) 45%,rgba(21,38,54,.6))}
.rv-msg{position:absolute;z-index:2;left:50%;bottom:7%;transform:translateX(-50%);margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:16px 22px;border-radius:14px;background:rgba(21,38,54,.62);color:#F7F1E7;text-align:center;max-width:80%;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rv-msg svg{width:24px;height:24px;flex:none}
.rv-msg b{font:500 20px/1.25 var(--serif);letter-spacing:-.01em}
.rv-msg span{font-size:14.5px;color:rgba(247,241,231,.82)}
.rv .m-lock{display:none}
.rec.has-src.is-locked .rv .m-lock{display:flex} .rec.has-src .rv .m-soon{display:none}
/* form card */
.rg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.rg h2{margin:0;font:400 24px/1.2 var(--serif);letter-spacing:-.015em;color:var(--ink)}
html[lang="zh-CN"] .rg h2{font-weight:500;font-size:22px;letter-spacing:0}
.rg-p{margin:6px 0 16px;font-size:15px;color:var(--soft)}
.f{display:block;margin:0 0 12px}
.f > span{display:block;margin:0 0 5px;font-size:14.5px;font-weight:500;color:var(--ink)}
.f > span small{font-weight:400;color:var(--muted);margin-left:6px;font-size:13.5px}
.f input,.f select{width:100%;min-height:48px;padding:10px 14px;border:1px solid rgba(21,38,54,.28);border-radius:10px;background:#fff;color:var(--text);
  font:400 16px/1.3 var(--sans);-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.f input:focus,.f select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,38,54,.14)}
.f .hint{display:block;margin-top:4px;font-size:13.5px;color:var(--muted)}
.hp{position:absolute !important;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;border:0;border-radius:12px;cursor:pointer;
  text-decoration:none;font:500 16.5px/1.25 var(--sans);background:var(--btn);color:#F7F1E7;transition:background-color .2s}
.btn:hover{background:var(--btn-h)} .btn svg{width:20px;height:20px}
.rg-submit{width:100%;margin-top:4px}
.is-loading .rg-submit{opacity:.7;cursor:progress}
.rg-note{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.rg-status{margin:10px 0 0;font-size:14.5px;min-height:0} .rg-status.is-error{color:#9A3B2E}
.rg-done:focus{outline:none}
.rg-done p{margin:8px 0 0;font-size:16px;color:var(--soft)}
.rg-done .btn{margin-top:16px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;margin-top:18px;font-weight:500;font-size:16px;color:var(--btn);
  text-decoration:underline;text-decoration-color:rgba(21,38,54,.3);text-underline-offset:4px}
footer{max-width:1120px;margin:0 auto;padding:26px var(--gx) calc(env(safe-area-inset-bottom) + 28px);font-size:13.5px;color:var(--muted)}
@media (min-width:600px){:root{--gx:32px} h1{font-size:38px} html[lang="zh-CN"] h1{font-size:32px}}
@media (min-width:960px){
  .rec{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px}
  .rec.is-open{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  h1{font-size:44px} html[lang="zh-CN"] h1{font-size:36px}
  .rg{padding:26px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

<header class="hd"><div class="wrap"><div class="bar"><a class="home" href="/talk" aria-label="Arena School"><img class="wm" src="/logos/arena/wordmark-navy-1600.png" alt="Arena School" width="1600" height="242"></a><a class="sw" href="/talk/recording" hreflang="en" lang="en">EN</a></div><div class="intro"><p class="ev">ISB PTA 家长咖啡会 · 2026年10月14日</p><p class="k">讲座录像</p><h1>孩子们未来的工作还不存在，那么，哪些能力最重要？</h1><p class="by">主讲：<b>羊筱涵</b>、<b>安广宁</b></p><p class="lede">观看讲座全程录像。填写以下信息，即可在本页观看。</p></div></div></header>
<main class="wrap">
<div class="rec is-locked" data-video-src="" data-download-src="">
  <div class="rv" data-poster="/talks/2026-10-isb-parent-coffee/slides/cn/01.jpg"><img src="/talks/2026-10-isb-parent-coffee/slides/cn/01.jpg" alt="" width="1600" height="900" decoding="async"><p class="rv-msg m-soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg><b>录像即将上线</b></p><p class="rv-msg m-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b>填写表格即可观看</b></p></div>
  <div class="rg">
    <form class="rg-form" action="https://formsubmit.co/ajax/contact@arenaschool.org" method="post" novalidate>
      <h2 id="rg-h">观看录像</h2><p class="rg-p">家长和教育者均可免费观看，只需填写一张简短的表格。</p>
      <input type="hidden" name="_subject" value="Arena School · 录像申请 · ISB 家长讲座">
      <label class="hp" aria-hidden="true">Leave empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label>
      <label class="f"><span>姓名</span><input type="text" name="name" required autocomplete="name" maxlength="120"></label>
      <label class="f"><span>邮箱</span><input type="email" name="email" required autocomplete="email" maxlength="200"></label>

      <label class="f"><span>微信号<small>选填</small></span><input type="text" name="wechat" autocomplete="off" maxlength="120"></label>

  </div>
</div>
