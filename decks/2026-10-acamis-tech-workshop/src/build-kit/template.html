<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOL TITLE</title>
<style>
  :root{--ink:#0B1A4A;--ink2:#2F55A8;--paper:#F6EFE7;--card:#FFFDFA;--edge:#E4D9CC;--muted:#6B6F80;--ok:#2E7D5B;--warn:#B5562F;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 19px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC",sans-serif}
  header{padding:28px 32px 8px;max-width:1100px;margin:0 auto}
  .tb-back{display:inline-block;margin:0 0 10px;font-weight:600;font-size:15px;color:var(--ink2);text-decoration:none}
  header h1{margin:0;font-size:36px;line-height:1.15;letter-spacing:-.01em}
  header p{margin:6px 0 0;color:var(--muted);font-size:19px}
  main{max-width:1100px;margin:0 auto;padding:16px 32px 40px;display:grid;gap:18px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:22px 24px;box-shadow:0 10px 24px -20px rgba(11,26,74,.35)}
  .card h2{margin:0 0 12px;font-size:22px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .field{display:grid;gap:6px;margin:0 0 14px}
  .field label{font-weight:600;font-size:16px;color:var(--ink2);letter-spacing:.02em}
  input,select,textarea{font:inherit;color:inherit;width:100%;padding:12px 14px;border:1px solid var(--edge);border-radius:10px;background:#fff}
  textarea{min-height:140px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:3px solid rgba(47,85,168,.25);border-color:var(--ink2)}
  .btn{font:600 18px/1 inherit;font-family:inherit;padding:14px 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer}
  .btn:hover{background:var(--ink2)}
  .btn-ghost{font:600 18px/1 inherit;font-family:inherit;padding:13px 21px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  .out{white-space:pre-wrap;background:#fff;border:1px dashed var(--edge);border-radius:10px;padding:16px 18px;min-height:60px}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(47,85,168,.12);color:var(--ink2);font-size:15px;font-weight:600}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--edge)}
  th{font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  footer{max-width:1100px;margin:0 auto;padding:0 32px 32px;color:var(--muted);font-size:14px}
  @media (max-width:600px){header,main,footer{padding-left:16px;padding-right:16px}header h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <a class="tb-back" href="../">&larr; Teacher Toolbox</a>
  <h1>TOOL TITLE</h1>
  <p>ONE-LINE DESCRIPTION: who it's for and what it does.</p>
</header>
<main>

</main>
<footer>Built by the room with Claude Code · ACAMIS Technology Conference 2026 · Arena School</footer>

</script>
<script src="../live.js"></script>
</body>
</html>
