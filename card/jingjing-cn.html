.line{margin:14px auto 0;max-width:21em;text-wrap:balance;font:italic 400 17px/1.45 'Newsreader',Georgia,serif;color:var(--soft)}

.row{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 16px;background:none;border:0;text-align:left;color:inherit;text-decoration:none;font:inherit;cursor:pointer}
.row:active{background:rgba(47,85,168,.06)}

.row .bub .ic{width:21px;height:21px}
.row .k{display:block;font:600 11.5px/1.2 'Geist',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.zh .row .k{letter-spacing:.08em;font-size:12.5px}
.row .v{display:block;margin-top:3px;font-size:16px;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{color:#A6AEB8;width:20px;height:20px}
.wx .bub{background:#E8F5EC;color:#1A9A4B}
.dl{margin:14px 20px 0}
.dl a{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;align-items:center;gap:12px;min-height:68px;padding:10px 16px;border:1.5px dashed rgba(21,38,54,.25);border-radius:18px;color:inherit;text-decoration:none}
.dl a:active{background:rgba(47,85,168,.05)}
.dl .bub{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#FBF4EA;display:grid;place-items:center}
.dl .bub .ic{width:21px;height:21px}
.dl b{display:block;font-weight:600;font-size:16px}
.dl small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.prev{margin:14px auto 0;width:min(78%,340px);border-radius:14px;overflow:hidden;border:4px solid #152636;box-shadow:0 18px 40px -24px rgba(11,26,74,.65)}
.prev img{display:block;width:100%;height:auto}
.tip{display:none;margin:14px 20px 0;padding:12px 14px;border-radius:14px;background:#FFF6DF;color:#5B4A1E;font-size:13.5px;line-height:1.5}
.wxb .tip{display:block}
.foot{margin-top:auto;padding:26px 20px calc(env(safe-area-inset-bottom) + 22px);text-align:center}
.foot a{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--soft);text-decoration:none;font-size:14px}
.foot img{height:16px;width:auto;opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,24px);opacity:0;max-width:min(420px,calc(100% - 32px));
  background:var(--ink);color:#FBF4EA;padding:13px 18px;border-radius:14px;font-size:14.5px;line-height:1.45;box-shadow:0 16px 40px -18px rgba(0,0,0,.6);transition:opacity .25s,transform .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:500px){body{padding:28px 0}.wrap{min-height:0;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(11,26,74,.5)}.top{padding-top:18px}}
@media (max-width:350px){.name{font-size:30px}.row{padding:10px 12px;gap:10px}.list,.dl,.prev,.tip{margin-left:14px;margin-right:14px}.cta{padding-left:14px;padding-right:14px}}
</style>

<script>
(function(){
 if(/MicroMessenger/i.test(navigator.userAgent))document.documentElement.classList.add('wxb');
 var t=document.getElementById('toast'),tm;
 function toast(m){t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('on')},3200)}
 function copy(s){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s)}
  return new Promise(function(ok,no){var a=document.createElement('textarea');a.value=s;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,s.length);try{document.execCommand('copy')?ok():no()}catch(e){no(e)}a.remove()})
 }
 document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){
  var s=b.getAttribute('data-copy');copy(s).then(function(){toast(b.getAttribute('data-msg'))},function(){toast(s)})
 })});
})();
</script>
